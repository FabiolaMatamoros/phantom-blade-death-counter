<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Death Counter</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent;overflow:hidden}
body.preview{background:#2a2d30;min-height:100vh}
#contador{position:absolute;top:20px;left:20px;font-family:'Cinzel',serif;font-weight:500;font-size:44px;line-height:1;white-space:nowrap;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.85)) drop-shadow(0 0 6px rgba(0,0,0,.5))}
.label{background:linear-gradient(180deg,#fff2c4 0%,#e9c46a 40%,#b8862b 70%,#f0d48a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em}
#contador .fila + .fila{margin-top:10px;font-size:28px}
#filaJefe{transition:opacity .6s ease}
#filaJefe.oculta{opacity:0}
.num{display:inline-block;color:#d4142c;margin-left:.25em}
.num.pop{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(1.35)}to{transform:none}}

#ayuda{position:fixed;left:20px;bottom:20px;display:none;font:13px system-ui,sans-serif;color:#ccc;line-height:1.6}
body.preview #ayuda{display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#a33;margin-right:6px}
.dot.ok{background:#3a3}
</style>

<body>
<div id="contador">
  <div class="fila"><span class="label" id="lblTotal"></span><span class="num" id="n">0</span></div>
  <div class="fila oculta" id="filaJefe"><span class="label" id="lblJefe"></span><span class="num" id="nj">0</span></div>
</div>

<div id="ayuda">
  Preview · <b>+</b> add, <b>-</b> subtract, <b>J</b> reset boss, <b>B</b> simulate boss, <b>0</b> reset all<br>
  <span class="dot" id="dot"></span><span id="estado">OBS not connected</span><br>
  <span class="dot" id="dot2"></span><span id="det">Detection: waiting for OBS</span>
</div>

<script>
// =====================================================================
//  SETTINGS — this is the only part you need to change
//  OBS WebSocket password:
//  OBS → Tools → WebSocket Server Settings → Show Connect Info → Server Password
// =====================================================================
const OBS_PASSWORD = 'YOUR_PASSWORD_HERE';

// Overlay text (e.g. 'MUERTES :' and 'JEFE ACTUAL :' in Spanish)
const LABEL_TOTAL = 'DEATHS :';
const LABEL_BOSS = 'CURRENT BOSS :';

// Names of the OBS sources used as manual buttons (Stream Deck / eye icon):
const SOURCE_ADD = 'ADD_DEATH', SOURCE_REMOVE = 'REMOVE_DEATH', SOURCE_RESET = 'RESET_DEATHS', SOURCE_NEW_BOSS = 'NEW_BOSS';
// Name of the OBS source that captures the game (detection looks for "DEAD" there):
const SOURCE_GAME = 'GAME';
// Minutes without seeing the boss bar before CURRENT BOSS resets to 0 and hides:
const MINUTOS_SIN_JEFE = 5;

const P = new URLSearchParams(location.search);
const PASS = P.get('obspass') || OBS_PASSWORD;
const EN_OBS = !!window.obsstudio;
if (!EN_OBS) document.body.classList.add('preview');

document.getElementById('lblTotal').textContent = LABEL_TOTAL;
document.getElementById('lblJefe').textContent = LABEL_BOSS;
const n = document.getElementById('n'), nj = document.getElementById('nj');
let muertes = 0, jefe = 0;
try {
  muertes = Number(localStorage.getItem('contador_muertes')) || 0;
  jefe = Number(localStorage.getItem('contador_jefe')) || 0;
} catch(e){}

function pintar(){
  n.textContent = muertes; nj.textContent = jefe;
  try { localStorage.setItem('contador_muertes', muertes); localStorage.setItem('contador_jefe', jefe); } catch(e){}
}
function pop(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
// Jefe "en curso": se vio su barra hace poco, o ya llevas muertes con él
let ultimaBarra = 0, ignorarBarraHasta = 0;
const VENTANA_JEFE = 12000;
const jefeReciente = () => Date.now() - ultimaBarra < VENTANA_JEFE;
const jefeEnCurso = () => jefe > 0 || jefeReciente();
function mostrarJefe(){ document.getElementById('filaJefe').classList.toggle('oculta', !jefeEnCurso()); }
// Última vez que se vio la barra (al abrir cuenta como "ahora" para no reiniciar de golpe)
let ultimaVezBarra = Date.now();
setInterval(() => {
  if (jefe > 0 && Date.now() - ultimaVezBarra > MINUTOS_SIN_JEFE * 60000){ jefe = 0; ultimaBarra = 0; pintar(); }
  mostrarJefe();
}, 1000);

// automatico = true cuando viene de la pantalla DEAD (solo cuenta al jefe si su barra se vio hace poco)
function sumar(d, automatico){
  const aJefe = automatico ? jefeReciente() : false; // botones: solo el total
  muertes = Math.max(0, muertes + d);
  if (aJefe && d > 0) jefe += d; // restar solo afecta el total
  pintar(); mostrarJefe();
  if (d > 0){ pop(n); if (aJefe) pop(nj); }
}
function nuevoJefe(){ jefe = 0; ultimaBarra = 0; pintar(); mostrarJefe(); }
function jefeDerrotado(){ jefe = 0; ultimaBarra = 0; ignorarBarraHasta = Date.now() + 15000; pintar(); mostrarJefe(); }
function reiniciar(){ muertes = 0; jefe = 0; ultimaBarra = 0; pintar(); mostrarJefe(); }

if (!EN_OBS){
  document.getElementById('contador').addEventListener('click', () => sumar(1));
  addEventListener('keydown', e => {
    if (e.key === '+' || e.key === 'Enter' || e.key === ' ') sumar(1);
    else if (e.key === '-') sumar(-1);
    else if (e.key === '0') reiniciar();
    else if (e.key === 'j' || e.key === 'J') nuevoJefe();
    else if (e.key === 'b' || e.key === 'B'){ ultimaBarra = ultimaVezBarra = Date.now(); mostrarJefe(); }
  });
}

// ===== Conexión a OBS para el Stream Deck =====
let obs, rid = 0;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
// SHA-256 propio, por si el navegador de OBS no tiene crypto.subtle con archivos locales
const K256 = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256js(msg){
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = msg.length, n = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(n); m.set(msg); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l * 8 / 4294967296));
  const w = new Uint32Array(64);
  for (let i = 0; i < n; i += 64){
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++){
      const x = w[t-15], y = w[t-2];
      const s0 = (x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3), s1 = (y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let t = 0; t < 64; t++){
      const S1 = (e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7), ch = (e&f)^(~e&g);
      const t1 = (h + S1 + ch + K256[t] + w[t]) | 0;
      const S0 = (a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10), mj = (a&b)^(a&c)^(b&c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  const out = new Uint8Array(32), o = new DataView(out.buffer);
  H.forEach((v, i) => o.setUint32(i * 4, v >>> 0));
  return out;
}
const sha = async t => {
  const bytes = new TextEncoder().encode(t);
  try { if (window.crypto && crypto.subtle) return b64(await crypto.subtle.digest('SHA-256', bytes)); } catch(e){}
  return b64(sha256js(bytes));
};
function estado(ok, txt){
  document.getElementById('dot').classList.toggle('ok', ok);
  document.getElementById('estado').textContent = txt;
}
function conectarOBS(){
  try { obs = new WebSocket('ws://127.0.0.1:' + (P.get('obsport') || 4455)); }
  catch(e){ return setTimeout(conectarOBS, 5000); }
  obs.onmessage = async e => {
    const m = JSON.parse(e.data);
    if (m.op === 0){
      const d = { rpcVersion: 1, eventSubscriptions: 128 };
      const a = m.d.authentication;
      if (a) d.authentication = await sha(await sha(PASS + a.salt) + a.challenge);
      obs.send(JSON.stringify({ op: 1, d }));
    } else if (m.op === 2){
      estado(true, 'OBS connected · Stream Deck ready');
      conectado = true; pendiente = false;
    } else if (m.op === 5 && m.d.eventType === 'SceneItemEnableStateChanged'){
      const ev = m.d.eventData;
      obs.send(JSON.stringify({ op: 6, d: { requestType: 'GetSceneItemSource', requestId: 'r' + (++rid),
        requestData: { sceneName: ev.sceneName, sceneItemId: ev.sceneItemId } } }));
    } else if (m.op === 7 && m.d.requestType === 'GetSceneItemSource' && m.d.requestStatus.result){
      const f = m.d.responseData.sourceName;
      if (f === SOURCE_ADD) sumar(1);
      else if (f === SOURCE_REMOVE) sumar(-1);
      else if (f === SOURCE_RESET) reiniciar();
      else if (f === SOURCE_NEW_BOSS) nuevoJefe();
    } else if (m.op === 7 && m.d.requestType === 'GetSourceScreenshot'){
      if (m.d.requestStatus.result) analizar(m.d.responseData.imageData);
      else { pendiente = false; esperaFuente = Date.now() + 3000; detEstado(false, 'Detection: can\'t find the source "' + SOURCE_GAME + '"'); }
    }
  };
  obs.onclose = ev => { conectado = false; estado(false, ev.code === 4009 ? (OBS_PASSWORD.startsWith('YOUR_') ? 'OBS: add your password to the file' : 'OBS: wrong password') : 'OBS not connected'); setTimeout(conectarOBS, 5000); };
  obs.onerror = () => { try { obs.close(); } catch(e){} };
}

// ===== Detección automática (DEAD, barra de jefe y victoria) =====
// Se pide a OBS una captura de la fuente GAME a 960x540 (solo en memoria, nada se guarda en disco).
const UMBRAL = Number(P.get('umbral')) || 0.7;
let conectado = false, pendiente = false, esperaFuente = 0;

function canvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c.getContext('2d', { willReadFrequently: true }); }
const c960 = canvas(960, 540), c480 = canvas(480, 270), c120 = canvas(120, 68);

function plantilla(arr){
  const med = arr.reduce((a, b) => a + b, 0) / arr.length;
  const cen = arr.map(v => v - med);
  return { med, cen, norm: Math.sqrt(cen.reduce((a, v) => a + v * v, 0)) };
}
// Correlación de una plantilla contra un mapa, probando desplazamientos
function buscar(mapa, W, T, TW, TH, x0, y0, mx, myMin, myMax){
  let mejor = 0;
  for (let oy = myMin; oy <= myMax; oy++) for (let ox = -mx; ox <= mx; ox++){
    let suma = 0;
    for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) suma += mapa[(y0 + oy + y) * W + x0 + ox + x];
    const med = suma / (TW * TH);
    if (med < T.med * 0.25) continue;
    let num = 0, den = 0;
    for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++){
      const a = mapa[(y0 + oy + y) * W + x0 + ox + x] - med;
      num += a * T.cen[y * TW + x]; den += a * a;
    }
    if (den > 0){ const c = num / (Math.sqrt(den) * T.norm); if (c > mejor) mejor = c; }
  }
  return mejor;
}

function simDead(){
  const W = 480, H = 270, d = c480.getImageData(0, 0, W, H).data, m = new Float32Array(W * H);
  for (let y = 222; y < 252; y++) for (let x = 212; x < 268; x++){
    const i = (y * W + x) * 4; m[y * W + x] = Math.max(0, d[i] - Math.max(d[i+1], d[i+2]));
  }
  return buscar(m, W, TPL_DEAD, 42, 17, 220, 230, 4, -4, 4);

function simVictoria(){
  const W = 120, H = 68, d = c120.getImageData(0, 0, W, H).data, m = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++){
    const r = d[i*4], g = d[i*4+1], b = d[i*4+2];
    const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
    m[i] = (mx - mn < 40) ? Math.max(0, mn - 150) : 0;
  }
  return buscar(m, W, TPL_VIC, 40, 54, 56, 3, 3, 0, 3);
}

// --- Barra del jefe: arriba al centro (960x540). Revisa el marco, no cuánto le queda de vida.
function hayBarra(){
  const d = c960.getImageData(0, 0, 960, 70).data;
  const px = (x, y) => { const i = (y * 960 + x) * 4; return [d[i], d[i+1], d[i+2]]; };
  const L = (x, y) => { const p = px(x, y); return (p[0] + p[1] + p[2]) / 3; };
  for (let y0 = 41; y0 <= 47; y0++) for (const dx of [-3, 0, 3]){
    let okHp = 0, nHp = 0, blancos = 0, trans = 0, prev = null, sep1 = 0, l1 = 0;
    for (let x = 362 + dx; x < 596 + dx; x += 2){
      const p = px(x, y0), l = (p[0] + p[1] + p[2]) / 3, rango = Math.max(...p) - Math.min(...p);
      const bl = l > 150 && rango < 45, os = l < 60;
      if (bl || os) okHp++;
      if (bl) blancos++;
      if (prev !== null && bl !== prev) trans++;
      prev = bl; nHp++;
      if (L(x, y0 + 3) < 62) sep1++;
      l1 += L(x, y0 + 4) - L(x, y0 + 3);
    }
    if (okHp / nHp < 0.9 || trans > 4 || sep1 / nHp < 0.85 || l1 / nHp <= 20) continue;
    let okG = 0, nG = 0, oros = 0, sep2 = 0, l2 = 0;
    for (let x = 400 + dx; x < 562 + dx; x += 2){
      const p = px(x, y0 + 7), oro = p[0] - p[2] > 35 && p[0] > 90, os = (p[0] + p[1] + p[2]) / 3 < 55;
      if (oro || os) okG++;
      if (oro) oros++;
      if (L(x, y0 + 10) < 62) sep2++;
      l2 += L(x, y0 + 11) - L(x, y0 + 10);
      nG++;
    }
    if (okG / nG < 0.85 || sep2 / nG < 0.8 || l2 / nG <= 15) continue;
    if (Math.max(blancos / nHp, oros / nG) < 0.03) continue;
    return true;
  }
  return false;
}

// --- Estado
let hitsDead = 0, bajosDead = 99, armadoDead = true, ultimaMuerte = 0;
let hitsBarra = 0;
let hitsVic = 0, ultimaVictoria = 0;

function detEstado(ok, txt){
  document.getElementById('dot2').classList.toggle('ok', ok);
  document.getElementById('det').textContent = txt;
}
function pedirCaptura(){
  if (!conectado || pendiente || Date.now() < esperaFuente || obs.readyState !== 1) return;
  pendiente = true;
  setTimeout(() => { pendiente = false; }, 3000);
  obs.send(JSON.stringify({ op: 6, d: { requestType: 'GetSourceScreenshot', requestId: 'c' + (++rid),
    requestData: { sourceName: SOURCE_GAME, imageFormat: 'jpg', imageWidth: 960, imageHeight: 540, imageCompressionQuality: 80 } } }));
}
function analizar(dataUrl){
  const img = new Image();
  img.onload = () => {
    c960.drawImage(img, 0, 0, 960, 540);
    c480.drawImage(img, 0, 0, 480, 270);
    c120.drawImage(img, 0, 0, 120, 68);
    pendiente = false;
    const ahora = Date.now();

    // Barra de jefe (2 capturas seguidas)
    const barra = hayBarra();
    hitsBarra = barra ? hitsBarra + 1 : 0;
    if (hitsBarra >= 2 && ahora > ignorarBarraHasta){ ultimaBarra = ahora; ultimaVezBarra = ahora; mostrarJefe(); }

    // Victoria (2 capturas seguidas) → jefe a 0
    const sv = simVictoria();
    hitsVic = sv >= UMBRAL ? hitsVic + 1 : 0;
    if (hitsVic >= 2 && ahora - ultimaVictoria > 15000){ ultimaVictoria = ahora; jefeDerrotado(); }

    // DEAD (2 capturas seguidas, una vez por muerte)
    const sd = simDead();
    if (sd >= UMBRAL){ hitsDead++; bajosDead = 0; } else { hitsDead = 0; if (sd < 0.45) bajosDead++; }
    if (bajosDead >= 3) armadoDead = true;
    if (armadoDead && hitsDead >= 2 && ahora - ultimaMuerte > 8000){
      armadoDead = false; ultimaMuerte = ahora;
      sumar(1, true);
    }

    detEstado(true, 'Detection active · DEAD ' + sd.toFixed(2) + ' · victory ' + sv.toFixed(2) + ' · boss bar: ' + (barra ? 'YES' : 'no'));
  };
  img.onerror = () => { pendiente = false; };
  img.src = dataUrl;
}
setInterval(pedirCaptura, 400);

pintar();
mostrarJefe();
conectarOBS();
